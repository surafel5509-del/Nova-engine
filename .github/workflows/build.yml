name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {split($2, v, "."); print v[1]}')
          echo "Detected Java major version: $MAJOR"
          if [ "$MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but found $MAJOR."
            exit 1
          fi

      - name: Set up Android SDK + NDK 26.1.10909125
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1"

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Create temporary debug keystore
        run: |
          if [ -f ./debug.keystore ]; then
            echo "debug.keystore already exists, skipping generation."
          else
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore ready (never committed/uploaded)."

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: expected APK not found at $APK"
            echo "Searching app/build/outputs/apk for any APKs:"
            find app/build/outputs/apk -name "*.apk" -print
            echo "FAIL: no debug APK exists."
            exit 1
          fi
          echo "APK built successfully:"
          ls -la "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 99
